name: CI

on:
  push:
    branches:
      - releases_ios
      - releases_android

jobs:
  # ─────────────────────────────────────────────
  # 1. Flutter Test (runs on every push)
  # ─────────────────────────────────────────────
  flutter_test:
    name: Run Flutter Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter --version

  # ─────────────────────────────────────────────
  # 2. iOS Build
  # ─────────────────────────────────────────────
  build_iOSApp:
    name: Build Flutter App (iOS)
    if: github.ref == 'refs/heads/releases_ios'
    needs: [flutter_test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ✅ FIX 1: Disable SPM via Flutter config (replaces the invalid --no-swift-package-manager flag)
      - name: Disable Swift Package Manager integration
        run: flutter config --no-enable-swift-package-manager

      # ✅ FIX 2: Full clean — removes stale Pods, Podfile.lock, and Flutter build cache
      - name: Clean Flutter & iOS artifacts
        run: |
          flutter clean
          cd ios
          rm -rf Pods Podfile.lock
          cd ..

      # ✅ FIX 3: Wipe DerivedData to remove any corrupt cached module maps from previous runs
      - name: Clear Xcode DerivedData
        run: rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Get Flutter dependencies
        run: flutter pub get

      # ✅ FIX 4: Cache CocoaPods gems to speed up pod install
      - name: Cache CocoaPods gems
        uses: actions/cache@v3
        with:
          path: ~/.cocoapods
          key: cocoapods-${{ hashFiles('ios/Podfile') }}
          restore-keys: |
            cocoapods-

      # Build without codesign (SPM is already disabled via flutter config above)
      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign

      - name: Package IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r app.ipa Payload

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS_App_Build
          path: build/ios/iphoneos/app.ipa

  # ─────────────────────────────────────────────
  # 3. Android Build
  # ─────────────────────────────────────────────
  build_androidApk:
    name: Build Flutter App (Android)
    if: github.ref == 'refs/heads/releases_android'
    needs: [flutter_test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Java for Gradle
        run: echo "org.gradle.java.home=${JAVA_HOME_17_X64}" >> android/gradle.properties

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter clean
      - run: flutter build apk --debug

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android_App_Build
          path: build/app/outputs/apk/debug/app-debug.apk

  # ─────────────────────────────────────────────
  # 4. Slack Notification
  # if: always() ensures this fires on both success and failure
  # ─────────────────────────────────────────────
  notify_Slack:
    name: Slack Notification
    runs-on: ubuntu-latest
    if: always()
    needs: [build_iOSApp, build_androidApk]
    steps:
      - name: Send Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: flutter-builds
          SLACK_COLOR: ${{ contains(needs.*.result, 'failure') && '#de2c2c' || '#2cde04' }}
          SLACK_ICON: https://github.com/ED209Repo/AnyPick/blob/main/images/mainlogo.png?size=48
          SLACK_MESSAGE: 'New build for Nas-HR launched 🚀'
          SLACK_TITLE: Build Completed
          SLACK_USERNAME: Danial
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}