name: CI

on:
  push:
    branches:
      - releases_ios
      - releases_android

jobs:
  flutter_test:
    name: Run Flutter Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter --version

  build_iOSApp:
    name: Build Flutter App (iOS)
    if: github.ref == 'refs/heads/releases_ios'
    needs: [flutter_test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter clean
      - run: |
          flutter build ios --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r app.ipa Payload
      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS_App_Build
          path: build/ios/iphoneos/app.ipa

  build_androidApk:
    name: Build Flutter App (Android)
    if: github.ref == 'refs/heads/releases_android'
    needs: [flutter_test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Java for Gradle
        run: echo "org.gradle.java.home=${JAVA_HOME_17_X64}" >> android/gradle.properties

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get
      - run: flutter clean
      - run: flutter build apk --debug

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android_App_Build
          path: build/app/outputs/apk/debug/app-debug.apk


  notify_Slack:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [build_iOSApp, build_androidApk]
    steps:
      - name: Send Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: flutter-builds
          SLACK_COLOR: ${{ job.status == 'success' && '#2cde04' || '#de2c2c' }}
          SLACK_ICON: https://github.com/ED209Repo/AnyPick/blob/main/images/mainlogo.png?size=48
          SLACK_MESSAGE: 'New build for Nas-HR launched 🚀'
          SLACK_TITLE: Build Completed
          SLACK_USERNAME: Danial
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}