name: CI

on:
  push:
    branches:
      - releases_ios
      - releases_android

jobs:
  # ─────────────────────────────────────────────
  # 1. Flutter Test (runs on every push)
  # ─────────────────────────────────────────────
  flutter_test:
    name: Run Flutter Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Print Flutter version
        run: flutter --version

  # ─────────────────────────────────────────────
  # 2. iOS Build & IPA
  # ─────────────────────────────────────────────
  build_iOSApp:
    name: Build Flutter App (iOS)
    if: github.ref == 'refs/heads/releases_ios'
    needs: [flutter_test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ✅ Disable SPM via Flutter config
      - name: Disable Swift Package Manager integration
        run: flutter config --no-enable-swift-package-manager

      # ✅ Full clean — removes stale Pods, Podfile.lock, and Flutter build cache
      - name: Clean Flutter & iOS artifacts
        run: |
          flutter clean
          cd ios
          rm -rf Pods Podfile.lock
          cd ..

      # ✅ Wipe DerivedData to remove corrupt cached module maps
      - name: Clear Xcode DerivedData
        run: rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Get Flutter dependencies
        run: flutter pub get

      # ✅ Cache CocoaPods gems to speed up pod install
      - name: Cache CocoaPods gems
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: cocoapods-${{ hashFiles('ios/Podfile') }}
          restore-keys: |
            cocoapods-

      # ✅ Run pod install — required after flutter clean deletes Pods/
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # ✅ Build IPA (not just .app) — required for App Store Connect upload
      # MinimumOSVersion is now present in ios/Flutter/AppFrameworkInfo.plist (fixes errors 90530 & 90360)
      - name: Build iOS IPA (no codesign)
        run: flutter build ipa --no-codesign

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS_App_Build
          path: build/ios/ipa/*.ipa

  # ─────────────────────────────────────────────
  # 3. Android Build
  # ─────────────────────────────────────────────
  build_androidApk:
    name: Build Flutter App (Android)
    if: github.ref == 'refs/heads/releases_android'
    needs: [flutter_test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Java for Gradle
        run: echo "org.gradle.java.home=${JAVA_HOME_17_X64}" >> android/gradle.properties

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter clean

      # ✅ Build release APK (not debug) suitable for Play Store
      - run: flutter build apk --release

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android_App_Build
          path: build/app/outputs/flutter-apk/app-release.apk

  # ─────────────────────────────────────────────
  # 4. Slack Notification
  # Uses `if: always()` so this ALWAYS fires — even when one build job is
  # skipped (e.g., iOS job is skipped on releases_android branch).
  # The color logic checks only the jobs that actually ran.
  # ─────────────────────────────────────────────
  notify_Slack:
    name: Slack Notification
    runs-on: ubuntu-latest
    if: always()
    needs: [flutter_test, build_iOSApp, build_androidApk]
    steps:
      - name: Determine build status
        id: status
        run: |
          # A job result is 'skipped' when the branch condition didn't match.
          # We consider only non-skipped jobs when computing failure.
          IOS_RESULT="${{ needs.build_iOSApp.result }}"
          ANDROID_RESULT="${{ needs.build_androidApk.result }}"
          TEST_RESULT="${{ needs.flutter_test.result }}"

          if [[ "$TEST_RESULT" == "failure" || "$IOS_RESULT" == "failure" || "$ANDROID_RESULT" == "failure" ]]; then
            echo "color=#de2c2c" >> $GITHUB_OUTPUT
            echo "message=❌ Build FAILED for Nas-HR" >> $GITHUB_OUTPUT
          else
            echo "color=#2cde04" >> $GITHUB_OUTPUT
            echo "message=✅ New build for Nas-HR launched successfully 🚀" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: flutter-builds
          SLACK_COLOR: ${{ steps.status.outputs.color }}
          SLACK_ICON: https://github.com/ED209Repo/AnyPick/blob/main/images/mainlogo.png?size=48
          SLACK_MESSAGE: ${{ steps.status.outputs.message }}
          SLACK_TITLE: Build Completed
          SLACK_USERNAME: Danial
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}